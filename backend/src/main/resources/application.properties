spring.application.name=mood-tracker
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# Notifications: "log" prints messages, "smtp" sends them (see application-smtp.properties)
moodtracker.mail.provider=log
moodtracker.mail.from=noreply@moodtracker.local
moodtracker.frontend-base-url=http://localhost:4200
